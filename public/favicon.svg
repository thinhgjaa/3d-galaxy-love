<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Gradient cho Trái tim -->
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="50%" stop-color="#ff0055" />
      <stop offset="100%" stop-color="#7900ff" />
    </linearGradient>

    <!-- Gradient cho Vành đai tinh vân -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ff00a0" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.2" />
    </linearGradient>

    <!-- Bộ lọc phát sáng Glow -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Nền không gian tối tròn -->
  <circle cx="32" cy="32" r="30" fill="#0b001a" />

  <!-- Vành đai quỹ đạo phía sau -->
  <ellipse cx="32" cy="33" rx="26" ry="9" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" transform="rotate(-25 32 33)" filter="url(#glow)" opacity="0.7" />

  <!-- Quả tim 3D phát sáng ở trung tâm -->
  <path d="M32 48 C32 48, 14 36, 14 24 C14 17.5, 19 14, 24.5 14 C28 14, 30.8 16, 32 18.5 C33.2 16, 36 14, 39.5 14 C45 14, 50 17.5, 50 24 C50 36, 32 48, 32 48 Z" fill="url(#heartGrad)" filter="url(#glow)" />

  <!-- Điểm sáng bóng trên trái tim -->
  <ellipse cx="22" cy="20" rx="3.5" ry="2" fill="#ffffff" opacity="0.6" transform="rotate(-30 22 20)" />

  <!-- Vành đai quỹ đạo phía trước (cắt ngang trái tim) -->
  <path d="M7 42 C12 46, 26 44, 40 37 C48 33, 56 27, 57 24" fill="none" stroke="url(#ringGrad)" stroke-width="2" transform="rotate(-25 32 33)" filter="url(#glow)" />

  <!-- Ngôi sao lấp lánh xung quanh -->
  <circle cx="12" cy="14" r="1.5" fill="#ffffff" filter="url(#glow)" />
  <circle cx="50" cy="46" r="1.2" fill="#00f0ff" filter="url(#glow)" />
  <circle cx="52" cy="12" r="1.8" fill="#ff77aa" filter="url(#glow)" />
  <circle cx="15" cy="50" r="1" fill="#ffffff" opacity="0.7" />
</svg>
