<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galaxy of Love 💖 | Vũ Trụ Tình Yêu 3D</title>
  </head>
  <body>
    <div id="app"></div>
    <!-- Canvas cho hiệu ứng vệt bụi sao ma thuật theo con trỏ chuột -->
    <canvas id="fairy-canvas"></canvas>
    <div id="ui-controls" class="ui-controls">
      <button id="btn-wormhole" title="Cổng Dịch Chuyển Không Gian (Wormhole Warp)">🌀</button>
      <button id="btn-theme" title="Đổi Bảng Màu Vũ Trụ (Theme)">🎨</button>
      <button id="btn-cinema" title="Chế Độ Điện Ảnh (Cinema Tour)">🎥</button>
      <button id="btn-text" title="Đổi Lời Nhắn Tình Yêu">💌</button>
      <button id="btn-upload" title="Tải Ảnh Cá Nhân Lên">🖼️</button>
      <button id="btn-change-music" title="Đổi Nhạc (Dán Link YouTube)">📻</button>
      <button id="btn-music" title="Bật/Tắt Âm Thanh">🎵</button>
      <button id="btn-reset-view" title="Về Góc Nhìn Toàn Cảnh">🌐</button>
      <button id="btn-toggle-ui" title="Ẩn Thanh Công Cụ (Zen Mode)">👁️</button>
    </div>

    <!-- Nút nhỏ hiện lại thanh công cụ khi đang ẩn -->
    <button id="btn-restore-ui" class="btn-restore-ui" title="Hiện lại thanh công cụ">✨</button>

    <!-- Màn chớp sáng khi dịch chuyển qua Cổng Không Gian -->
    <div id="wormhole-flash" class="wormhole-flash"></div>

    <!-- Ẩn input chọn file ảnh -->
    <input type="file" id="image-upload-input" accept="image/*" multiple style="display: none;" />

    <!-- Container cho trình phát YouTube ngầm -->
    <div id="youtube-player-container" style="position: fixed; top: -9999px; left: -9999px; width: 1px; height: 1px; opacity: 0; pointer-events: none;">
      <div id="yt-player"></div>
    </div>

    <!-- Modal nhập lời nhắn -->
    <div id="text-modal" class="text-modal">
      <div class="text-modal-content">
        <h3>💌 Lời nhắn gửi tới Vũ Trụ</h3>
        <input type="text" id="custom-text-input" placeholder="Nhập tên hoặc lời nhắn..." maxlength="35" value="Forever & Always 💖" />
        <div class="modal-buttons">
          <button id="btn-save-text">Cập Nhật</button>
          <button id="btn-cancel-text">Đóng</button>
        </div>
      </div>
    </div>

    <!-- Modal đổi nhạc YouTube -->
    <div id="music-modal" class="text-modal">
      <div class="text-modal-content">
        <h3>📻 Đổi Nhạc Nền (Link YouTube)</h3>
        <input type="text" id="youtube-url-input" placeholder="Dán link YouTube (ví dụ: https://www.youtube.com/watch?v=...)" />
        <div class="modal-buttons">
          <button id="btn-play-youtube">Phát Nhạc</button>
          <button id="btn-default-music">Nhạc Mặc Định</button>
          <button id="btn-cancel-music">Đóng</button>
        </div>
      </div>
    </div>

    <!-- Hướng dẫn tương tác nhỏ xinh ở góc trái -->
    <div id="hint-box" class="hint-box">
      <span>✨ Nhấp đúp để gọi sao băng | Click để bung pháo hoa tim</span>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
